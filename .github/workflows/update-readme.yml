name: Update README Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"
  push:
    paths:
      - "data/profile.json"
      - "data/solved.json"
      - "solutions/**"
      - "scripts/**"
      - "templates/**"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Fetch Codeforces submissions
        run: python scripts/fetch_codeforces.py

      - name: Generate stats and graphs
        run: python scripts/generate_stats.py

      - name: Generate README
        run: python scripts/generate_readme.py

      - name: Commit dashboard updates
        run: |
          if [[ -n "$(git status --porcelain README.md data/profile.json data/solved.json data/stats.json assets/graphs)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md data/profile.json data/solved.json data/stats.json assets/graphs
            git commit -m "chore: update CP dashboard"
            git push
          else
            echo "Dashboard already up to date."
          fi
